name: One-off check of Pokemon goal names

# A one-time test, run by hand (or by changing this file): it opens the website's code with the REAL TCGplayer card list
# and writes a report of how Pokemon names match, to a branch called "diagnostics". It doesn't change the website.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-names.yml"
      - ".github/diag/**"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the real card list from the live website
        run: |
          mkdir -p site
          cp index.html site/
          echo 'window.POKEVAULT_SITE = {};' > site/config.js
          base="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY##*/}"
          curl -fsSL "$base/tcgplayer-data.js" -o site/tcgplayer-data.js
          curl -fsSL "$base/tcgplayer-data-version.js" -o site/tcgplayer-data-version.js || true
          ls -la site
      - name: Install a browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Run the name check
        run: python .github/diag/check_names.py site
      - name: Publish the report on the diagnostics branch
        run: |
          cd out
          git init -q -b diagnostics
          git config user.name "Pokemon Vault diagnostics"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mon-report.json
          git commit -q -m "Pokemon goal name check ($(date -u +%F))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" diagnostics
