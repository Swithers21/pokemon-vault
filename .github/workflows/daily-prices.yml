name: Daily Pokemon prices

# Every evening this downloads the day's TCGplayer prices for English and Japanese Pokemon cards (through TCGCSV)
# for the Pokemon Vault website and publishes the website with GitHub Pages. Once a week it also refreshes the list of
# Chinese (Simplified) cards (names, numbers and pictures only, from PriceCharting's public set pages; Chinese prices
# are never published, the website asks PriceCharting for them from your own browser with your own key).
# It also publishes right away whenever the website's files change. "Run workflow" on the Actions tab runs it by hand.
# Before the first run: Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# Nothing goes live until it has been tried out first:
#   - "check" opens the website in a browser (desktop and phone size, with a made-up card list and a pretend camera) and runs
#     the tests in the tests folder. On the nightly price update only the quick ones run, and they can't hold the prices back.
#   - "build" ends by opening the finished website, with today's real card list, to make sure it loads and works.
# If either finds the website broken, nothing is published and the website that is live now stays as it is.

on:
  schedule:
    - cron: "40 21 * * *"   # 21:40 UTC: 5:40 PM New York time in summer, 4:40 PM in winter (TCGCSV refreshes before that)
    - cron: "10 4 * * *"    # and again overnight, in case TCGCSV was late or down (if nothing changed, it just republishes)
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}   # each job gets only what it needs (below)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Look through the website's script for slips (names that don't exist and the like)
        if: github.event_name != 'schedule'
        run: python tests/lint_app.py

      - name: Try the Chinese card list updater against pretend PriceCharting pages
        if: github.event_name != 'schedule'
        run: python tests/test_zh_update.py

      - name: Get a browser for the tests
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Try the website in a browser, desktop and phone size
        continue-on-error: ${{ github.event_name == 'schedule' }}   # (the nightly run only warns: the same files passed when they were published)
        run: python tests/run_tests.py ${{ github.event_name == 'schedule' && '--smoke' || '' }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bring back yesterday's card lists, earlier prices and the last look at the grading price pages
        uses: actions/cache/restore@v4
        with:
          path: |
            tcgplayer-cache
            tcgplayer-data.js
            tcgplayer-data-version.js
            zh-cards.js
            fee-watch.json
          key: pokevault-tcgplayer-${{ github.run_id }}
          restore-keys: pokevault-tcgplayer-

      - name: Download today's TCGplayer prices (English and Japanese)
        continue-on-error: true   # if TCGCSV is down, the website keeps the last prices
        env:
          POKEVAULT_PAUSE: "0.2"
        run: python update_tcgplayer_data.py

      - name: Refresh the list of Chinese (Simplified) cards (once a week)
        continue-on-error: true   # if PriceCharting can't be read, the website keeps the last list
        run: python update_zh_cards.py

      - name: Get a browser, for price pages that draw their prices with script (optional)
        continue-on-error: true
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Look at the grading companies' price pages (to warn if their fees change)
        continue-on-error: true   # if a page is down, the website just keeps what it knew
        run: python fee_watch.py

      - name: Keep the card lists and prices for tomorrow
        uses: actions/cache/save@v4
        with:
          path: |
            tcgplayer-cache
            tcgplayer-data.js
            tcgplayer-data-version.js
            zh-cards.js
            fee-watch.json
          key: pokevault-tcgplayer-${{ github.run_id }}

      - name: Put the website together
        run: |
          mkdir -p _site/icons
          cp index.html config.js manifest.webmanifest oauth.html share.html sw.js _site/
          cp icons/*.png _site/icons/
          if [ -f tcgplayer-data.js ]; then cp tcgplayer-data.js tcgplayer-data-version.js _site/; fi
          if [ -f zh-cards.js ]; then cp zh-cards.js _site/; fi
          if [ -f fee-watch.json ]; then cp fee-watch.json _site/; fi
          python card_history.py _site/history || echo "No price history files this time."
          ls -la _site

      - name: Make sure the finished website opens and works (a broken one is not published)
        run: python tests/smoke_built_site.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub pauses scheduled workflows in a repository with no new commits for 60 days.
  # A one-line note twice a month keeps the daily prices coming.
  keep-schedule-running:
    needs: deploy
    if: github.event_name == 'schedule' && github.event.schedule == '40 21 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Note that the daily prices are running (on the 1st and 15th)
        run: |
          day=$(date -u +%d)
          if [ "$day" != "01" ] && [ "$day" != "15" ]; then echo "Not today."; exit 0; fi
          date -u +"Prices last updated %Y-%m-%d" > .github/last-price-update.txt
          git config user.name "Pokemon Vault daily prices"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-price-update.txt
          if git diff --cached --quiet; then echo "Already noted today."; exit 0; fi
          git commit -m "Daily prices are running ($(date -u +%F))"
          git push
