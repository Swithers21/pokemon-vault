name: Copy the grading price pages

# Run by hand (Actions tab > this workflow > Run workflow), and by the monthly fee re-check: it saves what each grading company's
# price page says (just the parts near prices and notices) to a branch called "diagnostics", so the website's built-in fee table can
# be compared with the real wording. It doesn't change the website.
on:
  workflow_dispatch:

permissions: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # (only to write the copy to the "diagnostics" branch)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Copy the price pages
        run: python fee_pages_copy.py
      - name: Keep the copy on the diagnostics branch
        run: |
          cd out
          git init -q -b diagnostics
          git config user.name "Pokemon Vault diagnostics"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fee-pages.json
          git commit -q -m "Grading price pages ($(date -u +%F))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" diagnostics
